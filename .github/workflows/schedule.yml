name: Schedule test

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: '5,35 19-20 * * 1-5'
      timezone: "Asia/Manila"
    - cron: '15,45 3-4 * * 1-5'
      timezone: "America/Los_Angeles"
  workflow_dispatch:

permissions: {}

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - name: Show which schedule ran
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          {
            echo "Schedule: ${SCHEDULE:-none, started by $EVENT}"
            echo
            echo "Started: $(date -u '+%F %H:%M UTC') / $(TZ=America/Los_Angeles date '+%H:%M %Z') / $(TZ=Asia/Manila date '+%H:%M Manila')"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Event payload
        env:
          PAYLOAD: ${{ toJSON(github.event) }}
        run: echo "$PAYLOAD"
