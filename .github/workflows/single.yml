name: Single schedule test

on:
  schedule:
    - cron: '2/5 19-21 * * *'
      timezone: "Asia/Manila"
  workflow_dispatch:

permissions: {}

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - name: Show which schedule ran
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          {
            echo "Schedule: ${SCHEDULE:-none, started by $EVENT}"
            echo
            echo "Started: $(date -u '+%F %H:%M UTC') / $(TZ=America/Los_Angeles date '+%H:%M %Z') / $(TZ=Asia/Manila date '+%H:%M Manila')"
          } | tee -a "$GITHUB_STEP_SUMMARY"
